# Tool-level configuration for jaws, the JWall Engineering
# Infra CLI that provisions jwall.engineering infrastructure. One top-level knob
# for everything about how the tool runs, as opposed to what one site is (that
# lives in each site repository's jaws.yaml). The foundation
# stack reads the `aws`, `ecr` and `projects` sections with yamldecode; the CLI
# reads the whole file. Design:
# https://github.com/Jaws-Platform/jaws/pull/26

tool:
  log_level: info # JAWS_LOG_LEVEL overrides, for local debugging
  log_format: console # json in CI

terraform:
  version: 1.14.7
  lock_timeout: 120s
  plan_timeout: 15m

library:
  # The module families, published from Jaws-Platform/terraform-aws-jaws-<family>.
  # Each family has one version: every pin of it in this repository (sites,
  # bots, Databricks, the foundation) moves with the entry here.
  families:
    Jaws-Platform/jaws-ci/aws: 0.2.0
    Jaws-Platform/jaws-databricks/aws: 0.1.2
    Jaws-Platform/jaws-foundation/aws: 0.1.2
    Jaws-Platform/jaws-lichess-bot/aws: 0.1.2
    Jaws-Platform/jaws-network/aws: 0.1.2
    Jaws-Platform/jaws-research/aws: 0.1.2
    Jaws-Platform/jaws-static-site/aws: 0.1.2

state:
  bucket: jwall-engineering-tfstate
  region: us-east-1
  key_template: project={project}/env={environment}/{project}-{environment}.tfstate

aws:
  # The management account, where everything lives until it has moved to
  # production (the `production` section at the end of this file). Workflows
  # build role ARNs from the account and the project name, through
  # `jaws config env`, so no repository needs an account or role variable.
  account_id: "650503560686" # quoted: an account ID is a 12-digit string
  # The owner's Identity Center admin role in this account, exempt from the
  # hardened bucket policies (owner-access/, `terraform output -raw admin_role_arn`).
  admin_role_arn: arn:aws:iam::650503560686:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_AdministratorAccess_22a17d3bc2bca2d3

context:
  organization: jwall-engineering
  owner: jwallace145
  # The ManagedBy tag the tool stamps on everything it renders, like Organization
  # above: the account's, never the project file's.
  managed_by: jwall-engineering-infra

dns:
  zone: jwall.engineering
  zone_id: Z029546536VUFGDCPXZ21

ecr:
  repository: jwall-engineering-sites
  keep_release_images: 20
  expire_untagged_after_days: 7

sync:
  cache_control: public, max-age=3600 # assets without a content hash
  preview_cache_control: public, max-age=300
  html_cache_control: public, max-age=0, must-revalidate # pages: always fresh after a publish
  immutable_cache_control: public, max-age=31536000, immutable # site.immutable_paths

plan:
  comment_max_bytes: 60000

bot:
  # Bot projects (components: container-image + lichess-bot). The container
  # must log this within health_seconds after a deploy, or it is rolled back.
  health_log_pattern: awaiting challenges
  health_seconds: 90
  asset_wait: 30m # a release's Linux asset is attached after the release is published
  records_prefix: records/ # game records: <prefix>pgn|meta/schema=1/engine=<tag>/date=<day>/
  # Every zone that offers c8a (1e does not): spot tasks try each for capacity.
  # Append only: subnets are numbered by position, and the bot is in the first.
  availability_zones: [us-east-1a, us-east-1b, us-east-1c, us-east-1d, us-east-1f]
  # Pinned Amazon Linux 2023 image per architecture, by its Amazon image name.
  # The bot instance changes OS only when this changes (a PR whose bot plan shows
  # the replacement; Bot apply while the bot is idle). Name of the latest image:
  # aws ec2 describe-images --image-ids "$(aws ssm get-parameter --name
  #   /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  #   --query Parameter.Value --output text)" --query 'Images[0].Name' --output text
  amis:
    x86_64: al2023-ami-2023.12.20261026.1-kernel-6.18-x86_64 # ami-04b938437b69a2c9c in us-east-1

tasks:
  # Remote CI tasks (component task-runner, `task run`). The toolchain every
  # task instance installs; the current stable is the [pkg.rust] version in
  # https://static.rust-lang.org/dist/channel-rust-stable.toml
  rust_toolchain: 1.99.1
  poll_seconds: 5 # how often `task run` polls a task's output and status
  # Pinned images of task profiles (a profile's `image`), by Amazon-owned image
  # name; the bot stack resolves each to its ID. Upgrade by changing the pin.
  images:
    # NVIDIA driver and CUDA toolkit installed; ami-0f964da32f9793d2b (2026-10-28).
    deep-learning-gpu: Deep Learning Base OSS Nvidia Driver GPU AMI (Amazon Linux 2023) 20261027
  limits: # what any project file may ask for
    max_hours: 6 # GitHub stops a job at six hours; the launch role allows seven
    max_vcpus: 256
    root_volume_gb: 200 # the task-runner module's own upper bound is 200
  max_run_cost_usd: 50 # worst-case cost of one task; above it, the launch is refused

# Reviewed here; a project's own file cannot widen any of it. foundation/bots.tf
# reads the lists into the task launch role and the dataset policies, so they
# are the hard limit on what the project's pull requests can start. The
# allow-list of instance types is the hard limit on hourly cost, so review a
# new type's price with it. A `datasets` value is the bucket's approved
# retention: write_once, expire_prefixes, expire_noncurrent_days, versioning.
projects:
  braveheart:
    # The engine: SPRT and match tasks only. Since the split's cutover
    # (2026-11-18) self-play data is braveheart-selfplay's and training is
    # braveheart-trainer's; the engine declares no dataset. Its old bucket,
    # jwall-engineering-braveheart-nnue, is released from state and kept until
    # the owner deletes it.
    instance_types: [c8a.xlarge, c8a.8xlarge, c8a.16xlarge]
    task_profiles: [cpu, sprt, match]
    # max_run_cost_usd: 80 # optional per-project override of tasks.max_run_cost_usd
  braveheart-selfplay:
    # Braveheart's self-play dataset and the pipeline that grows it
    # (Braveheart-Chess/braveheart-selfplay): datagen and relabel.
    instance_types: [c8a.xlarge, c8a.8xlarge, c8a.16xlarge]
    task_profiles: [cpu, datagen, relabel]
    datasets:
      # The positions: every generation and label set, copied key for key from
      # jwall-engineering-braveheart-nnue's data/selfplay/. Versioned, with no
      # expiry, so an overwritten or deleted object can always be recovered.
      jwall-engineering-braveheart-selfplay-positions:
        prefix: data/
        versioning: true
      # Its home in production, the copy's destination (docs/datasets.md, "Moving a
      # dataset project to production"). The same retention: versioned, no expiry.
      jaws-braveheart-selfplay-positions:
        prefix: data/
        versioning: true
  braveheart-trainer:
    # The trainer for Braveheart's nets (Braveheart-Chess/braveheart-trainer): bullet
    # on GPU instances. It reads the positions through the selfplay bucket's
    # readers.
    instance_types: [c8a.xlarge, g6.xlarge, g6.2xlarge, g6e.xlarge]
    task_profiles: [cpu, gpu]
    datasets:
      # Every net trained, kept or not, with its training.json, losses and log,
      # copied key for key from jwall-engineering-braveheart-nnue's data/nets/.
      # Versioned, with no expiry, like the positions.
      jwall-engineering-braveheart-trainer-nets:
        prefix: data/
        versioning: true
      # Its home in production, the copy's destination; the same retention.
      jaws-braveheart-trainer-nets:
        prefix: data/
        versioning: true
  braveheart-bot:
    # Braveheart's Lichess bot (Braveheart-Chess/braveheart-lichess-bot): a container
    # image and a lichess-bot only, running a pinned release of the engine's
    # repository. No task runner and no datasets, so nothing to allow here.
    {}
  braveheart-databricks:
    # Braveheart's Databricks workspace (Braveheart-Chess/braveheart-databricks), for its
    # NNUE training data. Billed to Braveheart. `vpc_cidr` is allocated here so IP
    # capacity is central (/16 to /20; no overlap with another project or the bot VPC
    # 10.0.0.0/16); 10.48.0.0/16 keeps clear of the 10.40-10.41 ranges the tests use.
    # databricks-poc was retired when Databricks moved to production (2026-11-19).
    databricks:
      compute_policies: [small-interactive, jobs]
      cost_center: braveheart
      vpc_cidr: 10.48.0.0/16
      admins: [jimmy.wallace145@gmail.com]

# Databricks workspaces (projects with a `databricks` entry above). The account
# stack uses a service principal whose client secret lives in SSM at
# `secret_parameter` (never in this file). Reviewed here; a project's own file
# cannot widen the compute policies or pick its own network range.
databricks:
  # The account and the infra service principal (its application/client ID; the
  # secret is in SSM). Flip `enabled` to true once the one-time setup is done: the
  # foundation's Databricks resources and the `live` checks wait for it.
  # Enabled in one account at a time (docs/databricks.md, "One account at a time"):
  # torn down here on 2026-11-19 and rebuilt in production (the override below).
  enabled: false
  account_id: 64826090-46b0-471f-b2d6-f3e7490b992c
  client_id: 59a6c509-4d02-4622-b907-d42da61b2119
  secret_parameter: /jwall-engineering/databricks/client-secret
  metastore_name: jwall-engineering-us-east-1
  # The service principal is always added too (by client_id), so list people only.
  metastore_admins: [jimmy.wallace145@gmail.com]
  # Pinned Amazon Linux 2023 arm64 image for the NAT instance, by its Amazon image name.
  nat_ami: al2023-ami-2023.12.20261026.1-kernel-6.18-arm64
  # Set to the prefix Databricks configured for this account to get <prefix>-<project>
  # workspace URLs; null lets Databricks pick the URL.
  deployment_name_prefix: null
  audit_bucket: jwall-engineering-databricks-audit-logs
  events_prefix: events/
  readiness_timeout: 20m # how long apply waits for a new workspace to be RUNNING
  # The shared-objects host's URL, which Databricks picked when the foundation
  # created it: the data-access stack binds and grants onboarded datasets
  # through it. The foundation checks it still matches its own output.
  shared_host_url: https://dbc-46322154-036c.cloud.databricks.com
  # Cluster policy definitions, by kebab-case name. A project lists the names it gets.
  compute_policies:
    small-interactive:
      description: Small interactive clusters on cheap Graviton spot nodes
      definition:
        num_workers: {type: range, maxValue: 2}
        autotermination_minutes: {type: fixed, value: 30, hidden: false}
        node_type_id: {type: allowlist, values: [m7g.large, m7g.xlarge]}
        aws_attributes.availability: {type: fixed, value: SPOT_WITH_FALLBACK}
    jobs:
      description: Job clusters, up to four workers
      definition:
        cluster_type: {type: fixed, value: job}
        num_workers: {type: range, maxValue: 4}
        autotermination_minutes: {type: fixed, value: 30, hidden: true}
        node_type_id: {type: allowlist, values: [m7g.large, m7g.xlarge]}
        aws_attributes.availability: {type: fixed, value: SPOT_WITH_FALLBACK}

# The organization's development account. jaws records it and builds nothing in
# it yet: no foundation, no state bucket (all state lives in production), and no
# run addresses it. The owner signs in to it through owner-access, as the
# jaws-dev profile (docs/owner-access.md).
development:
  account_id: "859674017655"

# The production account, where everything is moving from the management
# account described above. A section under `overrides` replaces the same keys
# of the section with that name; everything else is shared. A run addresses one
# account: production for a project listed here, management otherwise
# (`--account` chooses for a project that is moving). This whole section is
# folded into the top level when the last project has moved.
production:
  bootstrapped: true # the owner ran docs/production-bootstrap.md on 2026-11-17
  # Projects with a stack in production: `moving` while the old stack still
  # exists in the management account, `moved` once it has been destroyed.
  projects:
    braveheart-bot: moved # moved 2026-11-18; old stack destroyed (docs/lichess-bot.md, "Moving a bot to the production account")
    guitar-knowledge-base: moved # moved 2026-11-18; old stack destroyed, old bucket kept (README, "Moving a site")
    cs-survival-guide: moved # moved 2026-11-18; old stack destroyed, old bucket kept (README, "Moving a site")
    main-site: moved # moved 2026-11-18; old stack destroyed, old bucket kept (README, "Moving a site")
    # With its positions (cut over 2026-11-19, braveheart-selfplay#25) and its nets
    # (cut over 2026-11-21, braveheart-trainer#18, once production's G and VT quota
    # was approved). Old stacks destroyed 2026-11-21, their buckets released and
    # kept (docs/datasets.md, "Moving a dataset project to production").
    braveheart-selfplay: moved
    braveheart-trainer: moved
    # The engine: SPRT and match tasks on c8a.16xlarge, no dataset. In production
    # since 2026-11-19 (it pins v0.65.0); old stack destroyed 2026-11-21.
    braveheart: moved
    braveheart-databricks: moved # rebuilt in production with Databricks; its old stacks destroyed 2026-11-19
  overrides:
    aws:
      account_id: "570327089884"
      # The owner's Identity Center admin role in production (docs/production-bootstrap.md, step 2).
      admin_role_arn: arn:aws:iam::570327089884:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_AdministratorAccess_013589f39f92382a
    context:
      organization: jaws
      managed_by: jaws
    state:
      # Suffixed with the account ID: the plain jaws-terraform-state was refused
      # at the bootstrap (BucketAlreadyExists) although it looked free.
      bucket: jaws-terraform-state-570327089884
    ecr:
      repository: jaws-cli
    dns:
      # The jwall.engineering zone the bootstrap created, authoritative since the
      # registrar switched to its name servers (2026-11-18).
      zone_id: Z0644006DW6W2HALU9BI
    databricks:
      enabled: true # rebuilt here as a whole on 2026-11-19 (docs/databricks.md, "Moving Databricks to the production account")
      # Its names there, so that nothing created in production (the roles'
      # policies, at the bootstrap) names the management account's.
      secret_parameter: /jaws/databricks/client-secret
      metastore_name: jaws-us-east-1
      audit_bucket: jaws-databricks-audit-logs
      # Production's own shared host (jaws-shared), created by v0.63.0 on
      # 2026-11-19: output databricks_shared_host.workspace_url. Datasets are
      # onboarded there only once it is set (docs/databricks.md).
      shared_host_url: https://dbc-287077d7-e617.cloud.databricks.com
