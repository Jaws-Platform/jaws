# How jaws runs Terraform: the version every stack runs, the module families
# it pins, and where every stack's state lives.

terraform:
  version: 1.14.7
  lock_timeout: 120s
  plan_timeout: 15m

library:
  # The module families, published from Jaws-Platform/terraform-aws-jaws-<family>.
  # Each family has one version: every pin of it in this repository (sites,
  # bots, Databricks, the foundation, the monitoring stack) moves with the entry here.
  families:
    Jaws-Platform/jaws-ci/aws: 0.4.0
    Jaws-Platform/jaws-databricks/aws: 0.2.0
    Jaws-Platform/jaws-foundation/aws: 0.2.0
    Jaws-Platform/jaws-lichess-bot/aws: 0.1.4
    Jaws-Platform/jaws-monitoring/aws: 0.8.0
    Jaws-Platform/jaws-network/aws: 0.1.2
    Jaws-Platform/jaws-research/aws: 0.1.2
    Jaws-Platform/jaws-static-site/aws: 0.1.2

state:
  # In the primary account (config/aws.yaml). Suffixed with the account ID: the
  # plain jaws-terraform-state was refused at the account's bootstrap
  # (BucketAlreadyExists) although it looked free.
  bucket: jaws-terraform-state-570327089884
  region: us-east-1
  key_template: project={project}/env={environment}/{project}-{environment}.tfstate
