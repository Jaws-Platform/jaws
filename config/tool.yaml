# How the jaws CLI names and tags what it builds, and ships its own image.

context:
  # The root of every name the tool gives: jaws-<project>-..., jaws-infra-ci-*.
  # A name only: no tag carries it (docs/tagging.md).
  name_root: jaws
  # The Organization tag of this tool's own stacks (the foundation): the GitHub
  # owner of this repository. A project's resources carry its own owner, the key
  # it is registered under in config/projects.yaml.
  organization: Jaws-Platform
  owner: jwallace145
  # The ManagedBy tag the tool stamps on everything it builds; like Organization,
  # the tool's, never a project file's.
  managed_by: JAWS

# The jaws CLI's own image repository, in the primary account.
ecr:
  repository: jaws-cli
  keep_release_images: 20
  expire_untagged_after_days: 7
