[project]
name = "jaws"
# The version lives in src/jaws/__init__.py, bumped by
# Release Please. Keeping it out of pyproject.toml keeps it out of uv.lock, so
# a release PR does not invalidate the lock.
dynamic = ["version"]
description = "Provisions jwall.engineering infrastructure (sites, bots, research projects and Databricks workspaces) with Terraform, from one YAML file per project."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.40",
  "databricks-sdk>=0.166",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "typer-slim>=0.17", # typer without rich and shellingham: smaller image, plain tracebacks
]

[project.scripts]
jaws = "jaws.cli:app"
# The command's name before the tool was called Jaws; removed once no consumer calls it.
jwall-engineering-sites = "jaws.cli:app"

[dependency-groups]
dev = [
  "boto3-stubs[ce,cloudfront,ec2,ecr,logs,pricing,s3,ssm,sts]>=1.44.3",
  "moto[ec2,ecr,logs,s3,ssm,sts]>=5.1",
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.13",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/jaws/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jaws"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["moto", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
