# A sample Databricks workspace project file. The only component is a
# databricks-workspace; the VPC range, cost center and admins come from
# `databricks-poc`'s databricks entry in config/projects.yaml.
version: 1
project: databricks-poc
repository: example-org/databricks-poc

tags:
  Project: databricks-poc
  Environment: prod
  Repository: example-org/databricks-poc
  Owner: owner@example.com

components:
  - kind: databricks-workspace
    compute_policies: [small-interactive, jobs]
    # Workspace users are listed here, so the team controls membership from this repo.
    # Admins stay central (databricks.admins of its entry in config/projects.yaml).
    users: [user@example.com]
