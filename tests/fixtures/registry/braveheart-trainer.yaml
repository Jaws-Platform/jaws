# jwall-engineering-sites project file: the trainer for Braveheart's NNUE nets
# (bullet, on GPU instances). Fields and behaviour:
# https://github.com/jwallace145/jwall-engineering-infra/blob/main/docs/research-projects.md
#
# The nets were copied key for key from jwall-engineering-braveheart-nnue
# (data/nets/) at the split; docs/nets.md records the move. The positions are
# braveheart-selfplay's, read through its bucket's readers.
version: 1
project: braveheart-trainer
repository: Braveheart-Chess/braveheart-trainer

# The tags every resource carries (through the provider's default_tags).
# Project, Repository and Environment=prod are cross-checked.
tags:
  Organization: jwall-engineering
  Project: braveheart-trainer
  Environment: prod
  Repository: Braveheart-Chess/braveheart-trainer
  Owner: jwallace145

components:
  # Training on dedicated, ephemeral EC2 instances, through
  # jwall-engineering-infra's remote-task.yml. A caller that names no profile
  # gets the fields below as the default `cpu` profile: a small on-demand box.
  - kind: task-runner
    instance_types: [c8a.xlarge]
    default_instance_type: c8a.xlarge
    market: on-demand
    max_hours: 2
    max_vcpus: 4
    results_days: 7                 # task outputs expire from S3 after this
    log_retention_days: 14
    profiles:
      gpu:
        instance_types: [g6.xlarge, g6.2xlarge, g6e.xlarge]  # NVIDIA L4, L4, L40S
        default_instance_type: g6.xlarge  # 4 vCPUs; the account's G and VT quota (5) fits one
        market: on-demand           # G and VT spot quota is 0
        max_hours: 6
        max_vcpus: 4
        image: deep-learning-gpu    # pinned in the tool's config.yaml: NVIDIA driver + CUDA
        root_volume_gb: 200         # gp3; SCRATCH_DIR lives on it
        whole_cores: false          # G types run two threads per core
        gpu: true                   # setup waits for nvidia-smi; env block records GPU/driver/CUDA
        datasets:
          nets: { write: [nets/] }  # data/nets/* out; the positions come from braveheart-selfplay's bucket

  # Every net trained, kept or not (data/nets/<net id>/: net.nnue,
  # training.json, the losses and the log): kept forever and versioned, as
  # config.yaml approves. Only the GPU profile adds objects; nothing automated
  # deletes. Self-play's relabel tasks read retired nets through the bucket
  # policy. Fields and access:
  # https://github.com/jwallace145/jwall-engineering-infra/blob/main/docs/datasets.md
  - kind: dataset
    name: nets
    bucket: jwall-engineering-braveheart-trainer-nets  # <Organization>-<project>-<name>
    prefix: data/
    versioning: true
    readers:
      - arn:aws:iam::650503560686:role/jwall-engineering-braveheart-selfplay-task-relabel  # Relabel's retired nets
