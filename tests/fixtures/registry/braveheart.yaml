# jaws project file: the engine's remote CI tasks (SPRT and
# matches). Everything else (region, account, VPC, AMI, names, state, CI roles)
# is derived by the tool. Fields and behaviour:
# https://github.com/Jaws-Platform/jaws/blob/main/docs/research-projects.md
#
# The engine has no dataset. Self-play data generation and relabelling, with
# the positions they write, are Braveheart-Chess/braveheart-selfplay's (infra
# project braveheart-selfplay); NNUE training on GPU instances, with the nets,
# is Braveheart-Chess/braveheart-trainer's (braveheart-trainer).
#
# The Lichess bot is not here: Braveheart-Chess/braveheart-lichess-bot deploys
# it, pinned to one of this repository's releases (infra project braveheart-bot).
version: 1
project: braveheart
repository: Braveheart-Chess/braveheart

# The six tags every resource carries (through the provider's default_tags).
# Project, Repository, Environment=prod and ManagedBy=terraform are cross-checked.
tags:
  Project: braveheart
  Environment: prod
  Repository: Braveheart-Chess/braveheart
  Owner: example-owner

components:
  # Remote CI tasks (SPRT, matches) on dedicated, ephemeral EC2 instances,
  # through jaws's remote-task.yml: a 64-core spot box by
  # default, capped at 58% of on demand, on demand only as a launch fallback.
  # https://github.com/Jaws-Platform/jaws/blob/main/docs/remote-tasks.md
  - kind: task-runner
    instance_types: [c8a.xlarge, c8a.8xlarge, c8a.16xlarge]  # whole Zen 5 cores, SMT off; the launch role's allow-list
    default_instance_type: c8a.16xlarge  # 64 cores, the bot's core: concurrency 60
    market: spot                    # spot | on-demand
    max_price_fraction: 0.58        # about $2.00/h for c8a.16xlarge; spot ran $0.93-1.39 in Oct 2026
    on_demand_fallback: true        # at launch only, after spot fails in every zone
    spot_wait_minutes: 5
    max_hours: 6                    # 1-6; GitHub stops a job at six hours anyway
    max_vcpus: 256                  # four c8a.16xlarge, the account spot quota; no workflow here names this default (SPRT and Match have their own profiles below)
    slot_wait_minutes: 30
    results_days: 7                 # task outputs expire from S3 after this
    log_retention_days: 14
    # A caller that names no profile gets the fields above as the default
    # `cpu` profile. One profile per workflow, so each kind of work has its own
    # market and budget here rather than in the workflow. Registered in
    # jaws's foundation/bots.tf, which bounds what this
    # file can start. Contract: its docs/remote-tasks.md, "Workflow profiles".
    profiles:
      sprt:
        instance_types: [c8a.xlarge, c8a.8xlarge, c8a.16xlarge]
        default_instance_type: c8a.16xlarge
        market: on-demand           # both legs gate; a reclamation leaves no verdict
        max_hours: 6
        max_vcpus: 128              # both legs at once
      match:
        instance_types: [c8a.xlarge, c8a.8xlarge, c8a.16xlarge]
        default_instance_type: c8a.16xlarge
        market: on-demand
        max_hours: 6
        max_vcpus: 64
