# A neutral platform configuration for the product's tests: config/'s shape, with every identifying value replaced (tests/platform/test_no_owner_values.py).
projects:
  example-owner:
    owner_id: '10000002'
    projects:
      main-site:
        description: The personal site at example.com, built with Astro
        type: site
        repository: site
        repository_id: '20000002'
        domain: example.com
      cs-survival-guide:
        description: A field guide to computer science fundamentals
        type: site
        repository: cs-survival-guide
        repository_id: '20000003'
        domain: survival-guide.example.com
      guitar-knowledge-base:
        description: A guitar theory and study knowledge base, built with Zensical
        type: site
        repository: guitar-knowledge-base
        repository_id: '20000004'
        domain: guitar.example.com
  Braveheart-Chess:
    owner_id: '10000003'
    projects:
      braveheart:
        description: The Braveheart UCI chess engine, measured by SPRT and match tasks
        type: research
        repository: braveheart
        repository_id: '20000005'
        instance_types:
        - c8a.xlarge
        - c8a.8xlarge
        - c8a.16xlarge
        task_profiles:
        - cpu
        - sprt
        - match
      braveheart-bot:
        description: Braveheart's Lichess bot, playing a pinned release of the engine
        type: bot
        repository: braveheart-lichess-bot
        repository_id: '20000006'
      braveheart-selfplay:
        description: Braveheart's self-play dataset and the datagen and relabel pipeline that grows it
        type: research
        repository: braveheart-selfplay
        repository_id: '20000007'
        instance_types:
        - c8a.xlarge
        - c8a.8xlarge
        - c8a.16xlarge
        task_profiles:
        - cpu
        - datagen
        - relabel
        datasets:
          jaws-braveheart-selfplay-positions:
            prefix: data/
            versioning: true
      braveheart-trainer:
        description: The trainer for Braveheart's NNUE nets, with bullet on GPU instances
        type: research
        repository: braveheart-trainer
        repository_id: '20000008'
        instance_types:
        - c8a.xlarge
        - g6.xlarge
        - g6.2xlarge
        - g6e.xlarge
        task_profiles:
        - cpu
        - gpu
        datasets:
          jaws-braveheart-trainer-nets:
            prefix: data/
            versioning: true
      braveheart-databricks:
        description: Braveheart's Databricks workspace, for its NNUE training data
        type: databricks
        repository: braveheart-databricks
        repository_id: '20000009'
        databricks:
          compute_policies:
          - small-interactive
          - jobs
          cost_center: braveheart
          vpc_cidr: 10.48.0.0/16
          admins:
          - owner@example.com
  Pi-Mathematical-Reasoning:
    owner_id: '10000004'
    projects:
      pi-benchmarks:
        description: Pi's benchmark files, mirrored in a private dataset bucket
        type: research
        repository: pi-benchmarks
        repository_id: '20000010'
        datasets:
          jaws-pi-benchmarks-problems:
            prefix: data/
            versioning: true
      pi-prover:
        description: Pi, local-first mathematical reasoning with proofs checked by Lean 4
        type: research
        repository: pi
        repository_id: '20000011'
        datasets:
          jaws-pi-prover-artifacts:
            prefix: data/
            versioning: true
  Prog-Strength:
    owner_id: '10000005'
    projects:
      prog-strength-archive:
        description: The cold archive of Prog Strength, retired in November 2026
        type: research
        repository: prog-strength-archive
        repository_id: '20000012'
        datasets:
          jaws-prog-strength-archive-backups:
            prefix: data/
            versioning: true
