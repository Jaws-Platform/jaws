name: Container release

# Reusable: a bot repository calls this when it publishes a release. It
# builds the image from the release's verified Linux asset, smoke-tests it,
# pushes it to ECR under the release tag, and rolls the bot to it; the bot
# finishes the game in progress first, so this job can wait that long.
# `bot reconcile` is idempotent: re-running a release is harmless.
#
# A pinned bot (lichess-bot.track: pinned) is released by its own repository,
# whose tags are not engine versions: it ships the engine release its project
# file pins, under a tag that also names its config, so the caller's release
# tag only selects the commit to read the project file and config from.
#
# The CLI runs from this workflow's own commit (job.workflow_sha), so
# the tag the caller pins selects the tool version. It runs with uv rather
# than the CLI image because the build needs Docker on the runner.
#
# Caller (in the bot repository):
#
#   on:
#     release:
#       types: [published]
#   permissions: {}
#   jobs:
#     release:
#       uses: jwallace145/jaws/.github/workflows/container-release.yml@vX.Y.Z
#       with:
#         project: braveheart
#       permissions:
#         contents: read
#         id-token: write

on:
  workflow_call:
    inputs:
      project:
        description: The project name in jaws.yaml. The release role is derived from it.
        required: true
        type: string
      version:
        description: >-
          Release tag to ship; defaults to the published release's tag. A pinned bot
          ships its pin, and refuses any other version.
        required: false
        type: string
        default: ""
      release-role-arn:
        description: Override the release role. Default, derived from this tool's config.yaml and `project`, `arn:aws:iam::<account>:role/<organization>-<project>-ci-release`.
        required: false
        type: string
        default: ""
      debug:
        description: Console log at debug level.
        required: false
        type: boolean
        default: false

concurrency:
  group: container-release-${{ inputs.project }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Build, push and deploy ${{ inputs.version || github.event.release.tag_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 240 # a rollout waits for the game in progress
    permissions:
      contents: read
      id-token: write # the release role, through OIDC
    env:
      VERSION: ${{ inputs.version || github.event.release.tag_name }}
      VERSION_INPUT: ${{ inputs.version }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version || github.event.release.tag_name }}
      - name: Check out jaws at this workflow's own commit
        uses: actions/checkout@v7
        with:
          repository: jwallace145/jaws
          ref: ${{ job.workflow_sha }}
          path: .jaws-tool
      - name: Check jaws is at this workflow's own commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          actual=$(git -C .jaws-tool rev-parse HEAD)
          if [[ -z "$WORKFLOW_SHA" ]]; then
            echo "::error::job.workflow_sha is empty, so the checkout fell back to main ($actual) instead of the version this workflow was called at"
            exit 1
          fi
          if [[ "$actual" != "$WORKFLOW_SHA" ]]; then
            echo "::error::jaws is checked out at $actual, not at this workflow's own commit $WORKFLOW_SHA"
            exit 1
          fi
          echo "jaws at $actual, this workflow's own commit"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev --project .jaws-tool
      - name: Resolve the release role
        id: role
        env:
          OVERRIDE: ${{ inputs.release-role-arn }}
          PROJECT: ${{ inputs.project }}
          CONFIG: .jaws-tool/config.yaml
        run: |
          if [ -n "$OVERRIDE" ]; then
            arn="$OVERRIDE"
          else
            # The tool says which account this is (config.yaml: management, or `production`).
            resolved=$(uv run --no-dev --project .jaws-tool jaws --config "$CONFIG" config env --project "$PROJECT")
            account=$(sed -n 's/^account_id=//p' <<<"$resolved")
            organization=$(sed -n 's/^organization=//p' <<<"$resolved")
            [[ "$account" =~ ^[0-9]{12}$ && -n "$organization" ]] || { echo "::error::jaws config env named no account or organization for $PROJECT"; exit 1; }
            arn="arn:aws:iam::${account}:role/${organization}-${PROJECT}-ci-release"
          fi
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: us-east-1
          role-session-name: container-release-${{ github.run_id }}-${{ github.run_attempt }}
      - name: jaws bot reconcile
        env:
          GITHUB_TOKEN: ${{ github.token }} # release listing (rate limits)
          JAWS_HEAD_SHA: ${{ github.sha }}
          DEBUG: ${{ inputs.debug }}
        run: |
          debug_flag=""
          if [ "$DEBUG" = "true" ]; then debug_flag="--debug"; fi
          # A pinned bot's release tag is the bot repository's, not an engine
          # release: let the project file's pin decide, unless a version was given.
          file=jaws.yaml; [ -f "$file" ] || file=jwall-engineering-sites.yaml # its name before the rename
          track=$(yq -r '.components[] | select(.kind == "lichess-bot") | .track // "latest-release"' "$file")
          version_args=(--version "$VERSION")
          if [ "$track" = "pinned" ] && [ -z "$VERSION_INPUT" ]; then version_args=(); fi
          # shellcheck disable=SC2086
          uv run --no-dev --project .jaws-tool jaws \
            --config .jaws-tool/config.yaml $debug_flag \
            bot reconcile "${version_args[@]}"
      - name: Upload the run log and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-release-${{ github.run_attempt }}
          path: .jaws/
          include-hidden-files: true # .jaws/ is a dot directory, which upload-artifact skips otherwise
          retention-days: 14
          if-no-files-found: ignore
