name: Site deploy

# Reusable: in the caller's `prod` environment, applies a site's infrastructure
# and publishes the built site for a release tag (`release`: apply, sync to
# prod/, invalidate CloudFront). The caller builds the site at the tag and
# uploads it as an artifact first.

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the uploaded artifact that holds the site built at the tag.
        required: true
        type: string
      tag:
        description: The release tag to deploy, for example v1.4.0.
        required: true
        type: string
      apply-role-arn:
        description: ARN of the site's ci-apply role (usually vars.AWS_APPLY_ROLE_ARN).
        required: true
        type: string
      site-url:
        description: The production URL, shown on the environment.
        required: false
        type: string
        default: ""
      debug:
        description: Console log at debug level.
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  deploy:
    name: jaws release
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ inputs.site-url }}
    permissions:
      contents: read
      id-token: write # the apply role, through OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Check out jaws at this workflow's own commit
        uses: actions/checkout@v7
        with:
          repository: jwallace145/jaws
          ref: ${{ job.workflow_sha }}
          path: .jaws-tool
      - name: Check jaws is at this workflow's own commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          actual=$(git -C .jaws-tool rev-parse HEAD)
          if [[ -z "$WORKFLOW_SHA" ]]; then
            echo "::error::job.workflow_sha is empty, so the checkout fell back to main ($actual) instead of the version this workflow was called at"
            exit 1
          fi
          if [[ "$actual" != "$WORKFLOW_SHA" ]]; then
            echo "::error::jaws is checked out at $actual, not at this workflow's own commit $WORKFLOW_SHA"
            exit 1
          fi
          echo "jaws at $actual, this workflow's own commit"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: .jaws-dist
      - name: release
        uses: ./.jaws-tool/.github/actions/jaws
        with:
          command: release --dist .jaws-dist
          role-arn: ${{ inputs.apply-role-arn }}
          head-sha: ${{ github.sha }}
          debug: ${{ inputs.debug }}
      - name: Upload the run log and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jaws-${{ github.job }}-${{ github.run_attempt }}
          path: .jaws/
          include-hidden-files: true # .jaws/ is a dot directory, which upload-artifact skips otherwise
          retention-days: 14
          if-no-files-found: ignore
