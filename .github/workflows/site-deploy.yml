name: Site deploy

# Reusable: in the caller's `prod` environment, applies a site's infrastructure
# and publishes the built site for a release tag (`release`: apply, sync to
# prod/, invalidate CloudFront). The caller builds the site at the tag and
# uploads it as an artifact first. A hub's caller also passes the platform's
# identity (`platform-image`, `account-id`, `name-root`) and a `check-prefix`.

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the uploaded artifact that holds the site built at the tag.
        required: true
        type: string
      tag:
        description: The release tag to deploy, for example v1.4.0.
        required: true
        type: string
      apply-role-arn:
        description: ARN of the site's ci-apply role (usually vars.AWS_APPLY_ROLE_ARN). Needed without platform-image; with it, an override that must be a role in account-id.
        required: false
        type: string
        default: ""
      site-url:
        description: The production URL, shown on the environment.
        required: false
        type: string
        default: ""
      platform-image:
        description: A hub's image repository in ECR (for example jaws-platform). With it, account-id and name-root, the run builds its role from the platform's identity and runs the hub's image. Empty runs as a project on Jaws's own pin does.
        required: false
        type: string
        default: ""
      account-id:
        description: The platform account, 12 digits. Needed with platform-image.
        required: false
        type: string
        default: ""
      name-root:
        description: The platform's name root (context.name_root). Needed with platform-image.
        required: false
        type: string
        default: ""
      check-prefix:
        description: The first word of the job's check name. The default, jaws, keeps today's names.
        required: false
        type: string
        default: jaws
      debug:
        description: Console log at debug level.
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  deploy:
    name: ${{ inputs.check-prefix }} release
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ inputs.site-url }}
    permissions:
      contents: read
      id-token: write # the apply role, through OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Check out jaws at this workflow's own commit
        uses: actions/checkout@v7
        with:
          repository: Jaws-Platform/jaws
          ref: ${{ job.workflow_sha }}
          path: .jaws-tool
      - name: Check jaws is at this workflow's own commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          actual=$(git -C .jaws-tool rev-parse HEAD)
          if [[ -z "$WORKFLOW_SHA" ]]; then
            echo "::error::job.workflow_sha is empty, so the checkout fell back to main ($actual) instead of the version this workflow was called at"
            exit 1
          fi
          if [[ "$actual" != "$WORKFLOW_SHA" ]]; then
            echo "::error::jaws is checked out at $actual, not at this workflow's own commit $WORKFLOW_SHA"
            exit 1
          fi
          echo "jaws at $actual, this workflow's own commit"
      - name: Build the role from the platform's identity
        id: role
        if: inputs.platform-image != '' || inputs.account-id != '' || inputs.name-root != ''
        uses: ./.jaws-tool/.github/actions/platform-role
        with:
          platform-image: ${{ inputs.platform-image }}
          account-id: ${{ inputs.account-id }}
          name-root: ${{ inputs.name-root }}
          role: apply
          role-arn: ${{ inputs.apply-role-arn }}
      - name: Assume the role
        if: steps.role.outputs.arn != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: us-east-1
          role-session-name: gha-site-release-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Resolve the platform image
        id: image
        if: steps.role.outputs.arn != ''
        uses: ./.jaws-tool/.github/actions/platform-image
        with:
          account-id: ${{ inputs.account-id }}
          repository: ${{ inputs.platform-image }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: .jaws-dist
      - name: release
        uses: ./.jaws-tool/.github/actions/jaws
        with:
          command: release --dist .jaws-dist
          role-arn: ${{ steps.role.outputs.arn == '' && inputs.apply-role-arn || '' }}
          image: ${{ steps.image.outputs.image-id }}
          platform-commit: ${{ steps.image.outputs.platform-commit }}
          platform-source: ${{ steps.image.outputs.platform-source }}
          head-sha: ${{ github.sha }}
          debug: ${{ inputs.debug }}
      - name: Upload the run log and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jaws-${{ github.job }}-${{ github.run_attempt }}
          path: .jaws/
          include-hidden-files: true # .jaws/ is a dot directory, which upload-artifact skips otherwise
          retention-days: 14
          if-no-files-found: ignore
