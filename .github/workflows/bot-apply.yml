name: Bot apply

# Applies a bot project's stack (stacks/bot): its image repository, VPC,
# records bucket and instance. Run by hand, after reading the bot plan
# comment, while the bot is idle: a change to the instance's AMI, type or
# user data replaces the instance and ends the game in progress. That is why
# this is not chained to every release of this repository.

on:
  workflow_dispatch:
    inputs:
      project:
        description: The bot project to apply (foundation/bots.tf).
        required: true
        type: choice
        options:
          - braveheart
          - braveheart-bot
          - braveheart-selfplay
          - braveheart-trainer
      destroy:
        description: Destroy the stack instead (the records, dataset and task results buckets and the secret are kept).
        required: false
        type: boolean
        default: false
      consumer-ref:
        description: >-
          A branch, tag or commit of the bot's repository to read its project file
          from. Empty reads its default branch. For a file that is not on the
          default branch (yet, or any more): a project being renamed.
        required: false
        type: string
        default: ""
      account:
        description: >-
          The account to address. `auto` uses the one config.yaml gives the
          project (production once it is listed under production.projects);
          `management` addresses the old stack of a project that is moving. A
          destroy of a moving project must name its account.
        required: false
        type: choice
        options: [auto, management, production]
        default: auto

concurrency:
  group: bot-apply-${{ inputs.project }}
  cancel-in-progress: false

permissions: {}

env:
  AWS_REGION: us-east-1

jobs:
  apply:
    name: ${{ inputs.destroy && 'Destroy' || 'Apply' }} ${{ inputs.project }}
    runs-on: ubuntu-latest
    environment:
      name: prod
    permissions:
      contents: read
      id-token: write # assume the bot's apply role through GitHub OIDC
    steps:
      - uses: actions/checkout@v7
      - name: Look up the bot's repository
        id: bot
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          repository=$(sed -n "s/^ *${PROJECT} *= *{ *repository *= *\"\([^\"]*\)\".*/\1/p" foundation/bots.tf)
          test -n "$repository" || { echo "::error::$PROJECT is not in foundation/bots.tf"; exit 1; }
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - name: Check out the bot's project file (its default branch, or consumer-ref)
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.bot.outputs.repository }}
          ref: ${{ inputs.consumer-ref }}
          path: .consumer
          sparse-checkout: |
            jaws.yaml
            jwall-engineering-sites.yaml
            lichess
          sparse-checkout-cone-mode: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Build the apply role ARN from config.yaml
        id: role
        env:
          PROJECT: ${{ inputs.project }}
          ACCOUNT: ${{ inputs.account != 'auto' && inputs.account || '' }}
        run: |
          # The tool says which account this is (config.yaml: management, or `production`).
          resolved=$(uv run jaws ${ACCOUNT:+--account "$ACCOUNT"} config env --project "$PROJECT")
          account=$(sed -n 's/^account_id=//p' <<<"$resolved")
          organization=$(sed -n 's/^organization=//p' <<<"$resolved")
          [[ "$account" =~ ^[0-9]{12}$ && -n "$organization" ]] || { echo "::error::jaws config env named no account or organization for $PROJECT"; exit 1; }
          echo "arn=arn:aws:iam::${account}:role/${organization}-${PROJECT}-ci-apply" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-bot-apply-${{ inputs.project }}-${{ github.run_id }}
      - name: Refuse a project file that names another project
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          file=.consumer/jaws.yaml; [ -f "$file" ] || file=.consumer/jwall-engineering-sites.yaml # its name before the rename
          named=$(yq -r .project "$file")
          if [ "$named" != "$PROJECT" ]; then
            echo "::error::the project file names '$named', not '$PROJECT'; pass consumer-ref for a ref whose file names $PROJECT"
            exit 1
          fi
      - name: jaws ${{ inputs.destroy && 'destroy' || 'apply' }}
        env:
          JAWS_STACKS_ROOT: ${{ github.workspace }}/stacks
          ACCOUNT: ${{ inputs.account != 'auto' && inputs.account || '' }}
          COMMAND: ${{ inputs.destroy && 'destroy --yes' || 'apply' }}
          # The CLI reads each counterpart's project file (consumers of the
          # project's datasets) from GitHub to render its bucket readers.
          GH_TOKEN: ${{ github.token }}
        run: |
          # COMMAND is `apply` or `destroy --yes`: two words on purpose.
          # shellcheck disable=SC2086
          uv run jaws --file .consumer/jaws.yaml ${ACCOUNT:+--account "$ACCOUNT"} $COMMAND
      - name: Upload the run log and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-apply-${{ inputs.project }}-${{ github.run_attempt }}
          path: .jaws/
          include-hidden-files: true # .jaws/ is a dot directory, which upload-artifact skips otherwise
          retention-days: 14
          if-no-files-found: ignore
