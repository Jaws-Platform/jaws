name: Bot apply

# Applies a bot project's stack (stacks/bot): its image repository, VPC,
# records bucket and instance. Run by hand, after reading the bot plan
# comment, while the bot is idle: a change to the instance's AMI, type or
# user data replaces the instance and ends the game in progress. That is why
# this is not chained to every release of this repository.

on:
  workflow_dispatch:
    inputs:
      project:
        # A free-form name, not a choice, so onboarding a project is one change
        # to config/projects.yaml: the first step refuses a project that is not
        # a bot or research project there.
        description: The bot or research project to apply (config/projects.yaml).
        required: true
        type: string
      destroy:
        description: Destroy the stack instead (the records, dataset and task results buckets and the secret are kept).
        required: false
        type: boolean
        default: false
      consumer-ref:
        description: >-
          A branch, tag or commit of the bot's repository to read its project file
          from. Empty reads its default branch. For a file that is not on the
          default branch (yet, or any more): a project being renamed.
        required: false
        type: string
        default: ""

concurrency:
  group: bot-apply-${{ inputs.project }}
  cancel-in-progress: false

permissions: {}

env:
  AWS_REGION: us-east-1

jobs:
  apply:
    name: ${{ inputs.destroy && 'Destroy' || 'Apply' }} ${{ inputs.project }}
    runs-on: ubuntu-latest
    environment:
      name: prod
    permissions:
      contents: read
      id-token: write # assume the bot's apply role through GitHub OIDC
    steps:
      - uses: actions/checkout@v7
      - name: Look up the bot's repository
        id: bot
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          repository=$(scripts/projects.sh bot research | jq -r --arg p "$PROJECT" '.[] | select(.project == $p) | .repository')
          test -n "$repository" || { echo "::error::$PROJECT is not a bot or research project in config/projects.yaml"; exit 1; }
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - name: Check out the bot's project file (its default branch, or consumer-ref)
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.bot.outputs.repository }}
          ref: ${{ inputs.consumer-ref }}
          path: .consumer
          sparse-checkout: |
            jaws.yaml
            lichess
          sparse-checkout-cone-mode: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Build the apply role ARN from the tool configuration
        id: role
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          resolved=$(uv run jaws config env)
          account=$(sed -n 's/^account_id=//p' <<<"$resolved")
          name_root=$(sed -n 's/^name_root=//p' <<<"$resolved")
          [[ "$account" =~ ^[0-9]{12}$ && -n "$name_root" ]] || { echo "::error::jaws config env named no account or name root for $PROJECT"; exit 1; }
          echo "arn=arn:aws:iam::${account}:role/${name_root}-${PROJECT}-ci-apply" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-bot-apply-${{ inputs.project }}-${{ github.run_id }}
      - name: Refuse a project file that names another project
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          file=.consumer/jaws.yaml
          named=$(yq -r .project "$file")
          if [ "$named" != "$PROJECT" ]; then
            echo "::error::the project file names '$named', not '$PROJECT'; pass consumer-ref for a ref whose file names $PROJECT"
            exit 1
          fi
      - name: jaws ${{ inputs.destroy && 'destroy' || 'apply' }}
        env:
          JAWS_STACKS_ROOT: ${{ github.workspace }}/stacks
          COMMAND: ${{ inputs.destroy && 'destroy --yes' || 'apply' }}
          # The CLI reads each counterpart's project file (consumers of the
          # project's datasets) from GitHub to render its bucket readers.
          GH_TOKEN: ${{ github.token }}
        run: |
          # COMMAND is `apply` or `destroy --yes`: two words on purpose.
          # shellcheck disable=SC2086
          uv run jaws --file .consumer/jaws.yaml $COMMAND
      - name: Upload the run log and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-apply-${{ inputs.project }}-${{ github.run_attempt }}
          path: .jaws/
          include-hidden-files: true # .jaws/ is a dot directory, which upload-artifact skips otherwise
          retention-days: 14
          if-no-files-found: ignore
