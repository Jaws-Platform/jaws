name: Release

# Merges to main accumulate changes in a Release Please PR. Merging that PR is
# the deliberate, human-reviewed act that releases a tag and applies the
# Terraform against it: the foundation, then the monitoring stack.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Re-publish the images of an existing release tag (for example v0.76.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  AWS_REGION: us-east-1

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so that release PRs are authored
      # by jwallace145-release-bot[bot] and CI runs on them.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The account the foundation is applied in and the image is published to,
  # read from the tool configuration (config/) at this workflow's own commit (the release's on a push).
  account:
    name: Account
    runs-on: ubuntu-latest
    needs: release-please
    # After a release, or on demand for an existing tag (release-please is then skipped).
    if: >-
      !cancelled() &&
      (
        (github.event_name == 'push' &&
         needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    permissions:
      contents: read
    outputs:
      account_id: ${{ steps.env.outputs.account_id }}
      name_root: ${{ steps.env.outputs.name_root }}
      ecr_repository: ${{ steps.env.outputs.ecr_repository }}
      # configured or absent: config/monitoring.yaml's monitoring section (the
      # monitoring stack's apply gate: without it the foundation creates no roles for it).
      monitoring: ${{ steps.env.outputs.monitoring }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Read the primary account from the tool configuration
        id: env
        run: |
          env=$(uv run jaws config env --monitoring)
          echo "$env" >> "$GITHUB_OUTPUT"

  apply:
    name: Terraform apply (${{ needs.release-please.outputs.tag_name }})
    runs-on: ubuntu-latest
    needs: [release-please, account]
    if: github.event_name == 'push' && needs.release-please.outputs.release_created == 'true'
    environment:
      name: prod
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      id-token: write # assume the apply role through GitHub OIDC
    defaults:
      run:
        working-directory: foundation
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ needs.account.outputs.account_id }}:role/${{ needs.account.outputs.name_root }}-infra-ci-apply
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ needs.release-please.outputs.tag_name }}
      - name: terraform init
        uses: ./.github/actions/terraform-init
        with:
          args: -backend-config=backend/prod.hcl
      # The metastore and audit log delivery (foundation/databricks.tf) need the
      # Databricks credential: each terraform step sources it into its own shell
      # (never GITHUB_ENV); it does nothing while databricks.enabled is false.
      - name: terraform plan
        run: |
          source ../scripts/databricks-credentials.sh ../config
          terraform plan -no-color -lock-timeout=120s -out=tfplan
      - name: terraform apply
        run: |
          source ../scripts/databricks-credentials.sh ../config
          terraform apply -no-color -lock-timeout=120s tfplan

  # The monitoring stack (monitoring/), after the foundation: its apply has just
  # created the stack's roles and state prefix, the billing bucket and the
  # Databricks billing job, so one release creates both, in order. A failed
  # foundation apply skips this job; a failed monitoring apply holds back
  # nothing else (the image needs only the foundation's apply). Without
  # config/monitoring.yaml's monitoring section there is no stack (and no role).
  monitoring-apply:
    name: Monitoring apply (${{ needs.release-please.outputs.tag_name }})
    runs-on: ubuntu-latest
    needs: [release-please, account, apply]
    if: >-
      github.event_name == 'push' &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.account.outputs.monitoring == 'configured'
    environment:
      name: prod
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}
    permissions:
      id-token: write # assume the stack's apply role through GitHub OIDC
      contents: read
    defaults:
      run:
        working-directory: monitoring
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ needs.account.outputs.account_id }}:role/${{ needs.account.outputs.name_root }}-monitoring-ci-apply
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-monitoring-apply-${{ needs.release-please.outputs.tag_name }}
      - name: terraform init
        uses: ./.github/actions/terraform-init
        with:
          args: -backend-config=backend/prod.hcl
          working-directory: monitoring
      - name: terraform plan
        run: terraform plan -no-color -lock-timeout=120s -out=tfplan
      - name: terraform apply
        run: terraform apply -no-color -lock-timeout=120s tfplan

  image:
    name: Publish jaws-cli (${{ needs.release-please.outputs.tag_name || inputs.tag }})
    runs-on: ubuntu-latest
    needs: [release-please, account, apply]
    # After a release's apply, or on demand for an existing tag. The apply
    # role's trust policy accepts only the `prod` environment's OIDC subject.
    if: >-
      !cancelled() &&
      (
        (github.event_name == 'push' &&
         needs.apply.result == 'success' &&
         needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    environment:
      name: prod
    permissions:
      contents: read
      id-token: write # assume the apply role, which holds ecr/push
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}
      - name: Choose the target (jaws-cli, or the only image of a tag cut before it)
        id: target
        # Only a tag with no generic stage falls back to the default target. With one, the
        # default target is the generic image: pushed as the immutable jaws-cli:<tag>, with no
        # configuration, it would break every site that runs that tag.
        run: |
          if grep -qx 'FROM generic AS jaws-cli' Dockerfile; then
            echo "target=jaws-cli" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^FROM [^ ]+ AS generic$' Dockerfile; then
            echo "::error::$TAG's Dockerfile has the generic stage but no 'FROM generic AS jaws-cli' line: refusing to push the generic image, which has no configuration, as jaws-cli:$TAG"
            exit 1
          else
            echo "::notice::$TAG predates the generic image: building its only image, config/ baked in, as before"
            echo "target=" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the Terraform version from the release (src/jaws/product.yaml, or config/terraform.yaml before it)
        id: config
        run: |
          # Releases cut before src/jaws/product.yaml existed pinned it in config/terraform.yaml.
          file=src/jaws/product.yaml
          [ -f "$file" ] || file=config/terraform.yaml
          version=$(yq -r .terraform.version "$file")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$file at $TAG pins no exact terraform.version"; exit 1; }
          echo "terraform_version=$version" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ needs.account.outputs.account_id }}:role/${{ needs.account.outputs.name_root }}-infra-ci-apply
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-image-${{ needs.release-please.outputs.tag_name || inputs.tag }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          target: ${{ steps.target.outputs.target }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ needs.account.outputs.ecr_repository }}:${{ env.TAG }}
          build-args: TERRAFORM_VERSION=${{ steps.config.outputs.terraform_version }}
      - name: Summary
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ needs.account.outputs.ecr_repository }}:${{ env.TAG }}
        run: printf '## Image\n\n- `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

  # Whether to publish the generic image: only once the owner has set the repository
  # variables, only for a tag on main's history that has the stage, never over a tag
  # already published. A job of its own, outside the `publish` environment, so that a skip
  # needs no approval.
  public-image-check:
    name: Public image check
    runs-on: ubuntu-latest
    needs: release-please
    # After a release, or on demand for an existing tag (release-please is then skipped).
    if: >-
      !cancelled() &&
      (
        (github.event_name == 'push' &&
         needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      ROLE_ARN: ${{ vars.JAWS_PUBLISH_ROLE_ARN }}
      IMAGE: ${{ vars.JAWS_PUBLIC_IMAGE }}
      # Checked here so that a malformed value fails before anything is pushed.
      KEEP: ${{ vars.JAWS_PUBLIC_IMAGE_KEEP }}
    steps:
      # Every branch's history (origin/main among them), for the check that the tag is on main.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Decide whether to publish the public image
        id: decide
        env:
          MANIFEST_TYPES: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json
        run: |
          publish() { echo "publish=$1" >> "$GITHUB_OUTPUT"; }
          if [[ -z "$ROLE_ARN$IMAGE" ]]; then
            echo "::notice::not publishing the public image: JAWS_PUBLISH_ROLE_ARN and JAWS_PUBLIC_IMAGE are not set (README.md, \"Jaws's public image\")"
            publish false; exit 0
          fi
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]] || { echo "::error::JAWS_PUBLISH_ROLE_ARN is not an IAM role ARN: '$ROLE_ARN'"; exit 1; }
          [[ "$IMAGE" =~ ^public\.ecr\.aws/[a-z0-9][a-z0-9._-]*/jaws$ ]] || { echo "::error::JAWS_PUBLIC_IMAGE is not public.ecr.aws/<alias>/jaws: '$IMAGE'"; exit 1; }
          [[ -z "$KEEP" || "$KEEP" =~ ^([1-9][0-9]*|all)$ ]] || { echo "::error::JAWS_PUBLIC_IMAGE_KEEP is neither a whole number of at least 1 nor all: '$KEEP'"; exit 1; }
          # Anyone who can push a tag can dispatch this workflow on main with it, and the
          # publish environment checks the dispatch's branch, not the tag. Release Please
          # tags a commit on main, so its tags always pass.
          git merge-base --is-ancestor "refs/tags/$TAG" origin/main || { echo "::error::$TAG is not on main's history, and a release tag must be on main: not publishing it"; exit 1; }
          if ! grep -Eq '^FROM [^ ]+ AS generic$' Dockerfile; then
            echo "::notice::$TAG predates the generic image: its only image bakes config/ in, and is never published"
            publish false; exit 0
          fi
          repository=${IMAGE#public.ecr.aws/}
          token=$(curl -fsS "https://public.ecr.aws/token/?service=public.ecr.aws&scope=repository:$repository:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $token" -H "Accept: $MANIFEST_TYPES" "https://public.ecr.aws/v2/$repository/manifests/$TAG")
          case "$code" in
            404) publish true ;;
            200) echo "::notice::$IMAGE:$TAG is already published: a published tag is never replaced"; publish false ;;
            *) echo "::error::could not tell whether $IMAGE:$TAG is published (HTTP $code from public.ecr.aws)"; exit 1 ;;
          esac

  public-image:
    name: Publish the public image (${{ needs.release-please.outputs.tag_name || inputs.tag }})
    runs-on: ubuntu-latest
    needs: [release-please, public-image-check]
    if: "!cancelled() && needs.public-image-check.outputs.publish == 'true'"
    environment:
      name: publish
    permissions:
      contents: read
      id-token: write # assume the publishing role
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      IMAGE: ${{ vars.JAWS_PUBLIC_IMAGE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name || inputs.tag }}
      - name: Read the Terraform version from the release (src/jaws/product.yaml)
        id: config
        run: |
          version=$(yq -r .terraform.version src/jaws/product.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::src/jaws/product.yaml at $TAG pins no exact terraform.version"; exit 1; }
          echo "terraform_version=$version" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.JAWS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1 # ECR Public's API is in us-east-1 only
          role-session-name: gha-public-image-${{ needs.release-please.outputs.tag_name || inputs.tag }}
      - uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          target: generic
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: TERRAFORM_VERSION=${{ steps.config.outputs.terraform_version }}
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '## Public image\n\n- `%s:%s@%s`\n' "$IMAGE" "$TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      # The prune runs with the publishing role, so its script comes from this workflow's own
      # commit (main's), never from the tag being published. Checked out after the build, so
      # it never enters the build context.
      - name: Check out the prune script at the workflow's own commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false
      # ECR Public has no lifecycle policies, so each publish prunes. The tag just pushed is
      # never deleted. `all` (skipped here) is for v1, once Jaws has consumers.
      - name: Prune the public repository to the newest release versions
        id: prune
        if: vars.JAWS_PUBLIC_IMAGE_KEEP != 'all'
        env:
          KEEP: ${{ vars.JAWS_PUBLIC_IMAGE_KEEP || '10' }}
        # Files, not pipes: Actions runs bash -e without pipefail, so a pipe would hide the
        # script's refusal. BatchDeleteImage answers 200 even when it deleted nothing.
        run: |
          aws ecr-public describe-images --region us-east-1 --repository-name jaws --output json > "$RUNNER_TEMP/images.json"
          python3 .release-tools/scripts/prune_public_images.py --keep "$KEEP" --published "$TAG" < "$RUNNER_TEMP/images.json" > "$RUNNER_TEMP/prune.jsonl"
          n=0
          while read -r batch; do
            n=$((n + 1))
            # aws gets /dev/null as its stdin: the loop's stdin is prune.jsonl, and aws reading
            # it would swallow the batches still to come.
            aws ecr-public batch-delete-image --region us-east-1 --repository-name jaws --image-ids "$batch" --output json < /dev/null > "$RUNNER_TEMP/deleted-$n.json"
            jq -e '.failures == []' "$RUNNER_TEMP/deleted-$n.json" > /dev/null || { echo "::error::BatchDeleteImage could not delete some images: $(jq -c .failures "$RUNNER_TEMP/deleted-$n.json")"; exit 1; }
          done < "$RUNNER_TEMP/prune.jsonl"
