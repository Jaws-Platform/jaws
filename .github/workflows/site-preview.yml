name: Site preview

# Reusable: publishes a built site to previews/pr-<n>/ as the preview role on
# open, synchronize and reopen, and removes it on close. The caller builds the
# site and uploads it as an artifact first. Pass `app-client-id` and the
# `app-private-key` secret to post the comment as the Jaws
# GitHub App instead of github-actions.

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the uploaded artifact that holds the built site.
        required: true
        type: string
      preview-role-arn:
        description: ARN of the site's ci-preview role (usually vars.AWS_PREVIEW_ROLE_ARN).
        required: true
        type: string
      app-client-id:
        description: ID of the Jaws GitHub App that authors the comment (usually vars.JES_APP_CLIENT_ID). Empty posts as github-actions.
        required: false
        type: string
        default: ""
      debug:
        description: Console log at debug level.
        required: false
        type: boolean
        default: false
    secrets:
      app-private-key:
        description: Private key of the Jaws GitHub App (usually secrets.JES_APP_PRIVATE_KEY). Needed with app-client-id.
        required: false

permissions: {}

jobs:
  deploy:
    name: jaws preview deploy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the preview role, through OIDC
      pull-requests: write # the sticky preview comment
    steps:
      - uses: actions/checkout@v7
      - name: Check out jaws at this workflow's own commit
        uses: actions/checkout@v7
        with:
          repository: Jaws-Platform/jaws
          ref: ${{ job.workflow_sha }}
          path: .jaws-tool
      - name: Check jaws is at this workflow's own commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          actual=$(git -C .jaws-tool rev-parse HEAD)
          if [[ -z "$WORKFLOW_SHA" ]]; then
            echo "::error::job.workflow_sha is empty, so the checkout fell back to main ($actual) instead of the version this workflow was called at"
            exit 1
          fi
          if [[ "$actual" != "$WORKFLOW_SHA" ]]; then
            echo "::error::jaws is checked out at $actual, not at this workflow's own commit $WORKFLOW_SHA"
            exit 1
          fi
          echo "jaws at $actual, this workflow's own commit"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: .jaws-dist
      - name: preview deploy
        id: deploy
        uses: ./.jaws-tool/.github/actions/jaws
        with:
          command: preview deploy --pr ${{ github.event.pull_request.number }} --dist .jaws-dist
          role-arn: ${{ inputs.preview-role-arn }}
          debug: ${{ inputs.debug }}
      - name: Mint a comment token for the Jaws app
        id: app-token
        if: always() && steps.deploy.outcome == 'success' && inputs.app-client-id != ''
        continue-on-error: true # a misconfigured app falls back to github-actions
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
      - name: Post the preview comment (updated on each push)
        if: always() && steps.deploy.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          header: preview
          path: .jaws/preview-comment.md
      - name: Upload the run log and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jaws-${{ github.job }}-${{ github.run_attempt }}
          path: .jaws/
          include-hidden-files: true # .jaws/ is a dot directory, which upload-artifact skips otherwise
          retention-days: 14
          if-no-files-found: ignore

  remove:
    name: jaws preview remove
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Check out jaws at this workflow's own commit
        uses: actions/checkout@v7
        with:
          repository: Jaws-Platform/jaws
          ref: ${{ job.workflow_sha }}
          path: .jaws-tool
      - name: Check jaws is at this workflow's own commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          actual=$(git -C .jaws-tool rev-parse HEAD)
          if [[ -z "$WORKFLOW_SHA" ]]; then
            echo "::error::job.workflow_sha is empty, so the checkout fell back to main ($actual) instead of the version this workflow was called at"
            exit 1
          fi
          if [[ "$actual" != "$WORKFLOW_SHA" ]]; then
            echo "::error::jaws is checked out at $actual, not at this workflow's own commit $WORKFLOW_SHA"
            exit 1
          fi
          echo "jaws at $actual, this workflow's own commit"
      - name: preview remove
        uses: ./.jaws-tool/.github/actions/jaws
        with:
          command: preview remove --pr ${{ github.event.pull_request.number }}
          role-arn: ${{ inputs.preview-role-arn }}
          debug: ${{ inputs.debug }}
      - name: Mint a comment token for the Jaws app
        id: app-token
        if: inputs.app-client-id != ''
        continue-on-error: true # a misconfigured app falls back to github-actions
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
      - name: Update the preview comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          header: preview
          path: .jaws/preview-comment.md
      - name: Upload the run log and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jaws-${{ github.job }}-${{ github.run_attempt }}
          path: .jaws/
          include-hidden-files: true # .jaws/ is a dot directory, which upload-artifact skips otherwise
          retention-days: 14
          if-no-files-found: ignore
