name: Databricks apply

# Applies a Databricks workspace project's two stacks (stacks/databricks-account,
# then stacks/databricks-workspace): its VPC, NAT instance, workspace, catalog
# and workspace configuration. Run by hand, after reading the Databricks plan
# comment. Re-running after a partial apply is safe. The CLI reads the
# Databricks client secret from SSM with the project's apply role. The `doctor`
# action runs the read-only checks with the same role (the first runbook step).

on:
  workflow_dispatch:
    inputs:
      project:
        # A free-form name, not a choice: the registry may be empty. The first
        # step refuses a project that is not registered.
        description: The Databricks project to apply (config/projects.yaml).
        required: true
        type: string
      action:
        description: >-
          apply both stacks; destroy them (the catalog bucket is emptied first); or
          doctor: run the read-only checks and print the table (changes nothing).
        required: false
        type: choice
        options: [apply, destroy, doctor]
        default: apply

concurrency:
  group: databricks-apply-${{ inputs.project }}
  cancel-in-progress: false

permissions: {}

env:
  AWS_REGION: us-east-1

jobs:
  apply:
    name: ${{ inputs.action }} ${{ inputs.project }}
    runs-on: ubuntu-latest
    environment:
      name: prod
    permissions:
      contents: read
      id-token: write # assume the project's apply role through GitHub OIDC
    steps:
      - uses: actions/checkout@v7
      - name: Look up the project's repository
        id: project
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          repository=$(scripts/projects.sh databricks | jq -r --arg p "$PROJECT" '.[] | select(.project == $p) | .repository')
          test -n "$repository" || { echo "::error::$PROJECT is not a databricks project in config/projects.yaml"; exit 1; }
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - name: Check out the project's file (its default branch)
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.project.outputs.repository }}
          path: .consumer
          sparse-checkout: |
            jaws.yaml
          sparse-checkout-cone-mode: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Build the apply role ARN from the tool configuration
        id: role
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          resolved=$(uv run jaws config env)
          account=$(sed -n 's/^account_id=//p' <<<"$resolved")
          name_root=$(sed -n 's/^name_root=//p' <<<"$resolved")
          [[ "$account" =~ ^[0-9]{12}$ && -n "$name_root" ]] || { echo "::error::jaws config env named no account or name root for $PROJECT"; exit 1; }
          echo "arn=arn:aws:iam::${account}:role/${name_root}-${PROJECT}-ci-apply" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-databricks-apply-${{ inputs.project }}-${{ github.run_id }}
      - name: jaws ${{ inputs.action }}
        env:
          JAWS_STACKS_ROOT: ${{ github.workspace }}/stacks
          COMMAND: ${{ inputs.action == 'destroy' && 'destroy --yes' || inputs.action == 'doctor' && 'databricks doctor' || 'apply' }}
          # The CLI reads the producers' project files of the datasets the
          # workspace reads from GitHub to render its endpoint statements.
          GH_TOKEN: ${{ github.token }}
        run: |
          # COMMAND is `apply`, `destroy --yes` or `databricks doctor`: words on purpose.
          # shellcheck disable=SC2086
          uv run jaws --file .consumer/jaws.yaml $COMMAND
      - name: Upload the run log and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: databricks-apply-${{ inputs.project }}-${{ github.run_attempt }}
          path: .jaws/
          include-hidden-files: true # .jaws/ is a dot directory, which upload-artifact skips otherwise
          retention-days: 14
          if-no-files-found: ignore
